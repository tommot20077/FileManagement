name: 部屬到生產環境

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v3

      - name: 測試開始通知
        run: echo "開始部署前的測試流程..."

      - name: 設定 OpenJDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 顯示 Java 版本
        run: java -version

      - name: 設定環境變數以使用 demo 設定檔
        run: echo "SPRING_PROFILES_ACTIVE=demo" >> $GITHUB_ENV

      - name: 執行 Maven 測試
        id: maven_test
        run: |
          echo "::group::Maven 測試"
          chmod +x ./mvnw
          ./mvnw test
          echo "::endgroup::"
        continue-on-error: false

      - name: 測試結果通知
        run: echo "測試流程完成..."

  deploy_backend:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: 部署開始通知
        run: echo "開始部署流程..."

      - name: 設置 SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加主機
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 確定部署環境
        id: set_env
        run: |
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            echo "環境: 正式環境 (main 分支)"
            echo "ENV_NAME=正式環境" >> $GITHUB_OUTPUT
          else
            echo "環境: 開發環境 (develop 分支)"
            echo "ENV_NAME=開發環境" >> $GITHUB_OUTPUT
          fi
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT


      - name: 在 VPS 上部署後端
        id: deploy_backend
        run: |
          echo "::group::後端部署進度"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
          
            # 顯示部署信息
            echo "部署信息:"
            echo "  - 時間: $(date)"
            echo "  - 分支: ${GITHUB_REF##*/}"
            echo "  - 提交: ${GITHUB_SHA}"
          
            # 進入專案目錄
            cd /root/dev/FileManager
            echo "更新到最新代碼"
          
            # 拉取最新代碼確保獲取所有遠端變更
            git fetch --all
          
            # 強制同步到遠端分支
            git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
          
            # 使用 Maven 構建 JAR (使用 OpenJDK 21)
            echo "構建應用"
            ./mvnw clean package -DskipTests
          
            # 確認 target 目錄內是否有 JAR 文件
            JAR_FILE=$(find target -maxdepth 1 -name "*.jar" | head -n 1)

            if [ -z "$JAR_FILE" ]; then
              echo "構建失敗: JAR 文件不存在"
              exit 1
            else
              echo "構建成功: 找到 JAR => $JAR_FILE"
            fi
          
            echo "停止現有服務"
            # 使用 docker compose 停止現有服務
            docker compose down filemanager-end
          
            # 刪除舊的映像檔 (若存在)
            if [ "$(docker images -q filemanager-end:latest)" ]; then
              echo "刪除舊映像檔"
              docker rmi filemanager-end:latest
            fi
          
            # 清理無用的映像檔
            docker image prune -f
          
            # 使用 docker compose 重新構建並啟動服務
            echo "構建新容器"
            docker compose build filemanager-end
          
            echo "啟動服務"
            docker compose up -d filemanager-end
          
            # 檢查服務狀態
            echo "檢查服務狀態"
            docker ps | grep filemanager-end
          
            # 等待服務啟動
            echo "等待服務啟動 (10秒)"
            sleep 10
          
            # 檢查日誌
            echo "最近日誌:"
            docker logs --tail 50 filemanager-end
          
            # 檢查服務健康狀態
            echo "健康檢查"
            if docker ps | grep filemanager-end | grep -q "Up"; then
              echo "服務運行正常"
            else
              echo "服務可能未正常運行"
              exit 1
            fi
          EOF
          echo "::endgroup::"

  deploy_frontend:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: 部署開始通知
        run: echo "開始部署流程..."

      - name: 設置 SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加主機
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 確定部署環境
        id: set_env
        run: |
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            echo "環境: 正式環境 (main 分支)"
            echo "ENV_NAME=正式環境" >> $GITHUB_OUTPUT
          else
            echo "環境: 開發環境 (develop 分支)"
            echo "ENV_NAME=開發環境" >> $GITHUB_OUTPUT
          fi
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT


      - name: 在 VPS 上部署前端
        id: deploy_frontend
        run: |
          echo "::group::前端部署進度"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            # 進入前端專案目錄
            cd /root/dev/FileManager-front
            echo "更新前端代碼"

            # 拉取最新代碼確保獲取所有遠端變更
            git fetch --all

            # 強制同步到遠端分支
            git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)

            # 進入主專案目錄
            cd /root/dev/FileManager

            echo "停止現有前端服務"
            # 使用 docker compose 停止現有服務
            docker compose down filemanager-front

            # 刪除舊的映像檔 (若存在)
            if [ "$(docker images -q filemanager-front:latest)" ]; then
              echo "刪除舊前端映像檔"
              docker rmi filemanager-front:latest
            fi

            # 清理無用的映像檔
            docker image prune -f

            # 使用 docker compose 重新構建並啟動前端服務
            echo "構建新前端容器"
            docker compose build filemanager-front

            echo "啟動前端服務"
            docker compose up -d filemanager-front

            # 檢查服務狀態
            echo "檢查前端服務狀態"
            docker ps | grep filemanager-front
          EOF
          echo "::endgroup::"

  check_status:
    needs: [ deploy_backend, deploy_frontend ]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: 部署結果通知
        run: echo "部署流程完成..."

      - name: 設置 SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加主機
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 健康檢查
        id: health_check
        run: |
          echo "::group::健康檢查"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # 執行應用健康檢查
            echo "執行應用健康檢查"
            HEALTH_CHECK_URL="http://127.0.0.1:8078/actuator/health"

            # 嘗試次數
            MAX_ATTEMPTS=5
            ATTEMPT=1

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "嘗試 $ATTEMPT/$MAX_ATTEMPTS..."
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_CHECK_URL)

              if [ "$RESPONSE" = "200" ]; then
                echo "健康檢查通過!"
                exit 0
              else
                echo "健康檢查失敗，狀態碼: $RESPONSE"
                if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                  echo "等待 10 秒後重試..."
                  sleep 10
                fi
              fi

              ATTEMPT=$((ATTEMPT+1))
            done

            echo "健康檢查失敗: 應用未能在指定時間內就緒"
            exit 1
          EOF
          echo "::endgroup::"