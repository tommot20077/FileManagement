name: 部署到生產環境

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    branches:
      - develop
      - release/*
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: file_management
          MYSQL_USER: test
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
          
      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_DATABASE: file_management
        ports:
          - 27017:27017
        options: >-
          --health-cmd="echo 'db.runCommand(\"ping\").ok' | mongosh --quiet"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 測試開始通知
        run: echo "開始部署前的測試流程..."

      - name: 設定 OpenJDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 顯示 Java 版本
        run: java -version

      - name: 執行 Maven 測試
        id: maven_test
        run: |
          echo "::group::Maven 測試"
          chmod +x ./mvnw
          # 使用 test,demo,ci profiles 執行測試
          # ci profile 會覆蓋 demo 的數據庫連接設定
          ./mvnw test -Dspring.profiles.active=test,demo,ci
          echo "::endgroup::"
        continue-on-error: false
        env:
          # 確保測試連接到 Service Containers
          # 載入順序：test -> demo -> ci (ci 覆蓋數據庫連接)
          SPRING_PROFILES_ACTIVE: test,demo,ci

      - name: 測試結果通知
        run: echo "測試流程完成..."

  deploy_backend:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/develop')
    steps:
      - name: 部署開始通知
        run: echo "開始部署流程..."

      - name: 設置 SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加主機
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 確定部署環境
        id: set_env
        run: |
          echo "環境: 開發環境 (develop 分支)"
          echo "ENV_NAME=開發環境" >> $GITHUB_OUTPUT
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: 在 VPS 上部署後端
        id: deploy_backend
        run: |
          echo "::group::後端部署進度"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
          
            # 顯示部署信息
            echo "部署信息:"
            echo "  - 時間: $(date)"
            echo "  - 分支: ${GITHUB_REF##*/}"
            echo "  - 提交: ${GITHUB_SHA}"
          
            # 進入專案目錄
            cd /root/dev/FileManager
            echo "更新到最新代碼"
          
            # 拉取最新代碼確保獲取所有遠端變更
            git fetch --all
          
            # 強制同步到遠端分支
            git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
          
            # 添加權限
            chmod +x ./mvnw
          
            # 使用 Maven 構建 JAR (使用 OpenJDK 21)
            echo "構建應用"
            ./mvnw clean package -DskipTests
          
            # 確認 target 目錄內是否有 JAR 文件
            JAR_FILE=$(find target -maxdepth 1 -name "*.jar" | head -n 1)
          
            if [ -z "$JAR_FILE" ]; then
              echo "構建失敗: JAR 文件不存在"
              exit 1
            else
              echo "構建成功: 找到 JAR => $JAR_FILE"
            fi
          
            echo "停止現有服務"
            # 使用 docker compose 停止現有服務
            docker compose down filemanager-end
          
            # 刪除舊的映像檔 (若存在)
            if [ "$(docker images -q filemanager-end:latest)" ]; then
              echo "刪除舊映像檔"
              docker rmi filemanager-end:latest
            fi
          
            # 清理無用的映像檔
            docker image prune -f
          
            # 使用 docker compose 重新構建並啟動服務
            echo "構建新容器"
            docker compose build filemanager-end
          
            echo "啟動服務"
            docker compose up -d filemanager-end
          
            # 檢查服務狀態
            echo "檢查服務狀態"
            docker ps | grep filemanager-end
          
            # 等待服務啟動
            echo "等待服務啟動 (10秒)"
            sleep 10
          
            # 檢查日誌
            echo "最近日誌:"
            docker logs --tail 50 filemanager-end
          
            # 檢查服務健康狀態
            echo "健康檢查"
            if docker ps | grep filemanager-end | grep -q "Up"; then
              echo "服務運行正常"
            else
              echo "服務可能未正常運行"
              exit 1
            fi
          EOF
          echo "::endgroup::"

  deploy_frontend:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/develop')
    steps:
      - name: 部署開始通知
        run: echo "開始部署流程..."

      - name: 設置 SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加主機
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 確定部署環境
        id: set_env
        run: |
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            echo "環境: 正式環境 (main 分支)"
            echo "ENV_NAME=正式環境" >> $GITHUB_OUTPUT
          else
            echo "環境: 開發環境 (develop 分支)"
            echo "ENV_NAME=開發環境" >> $GITHUB_OUTPUT
          fi
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: 在 VPS 上部署前端
        id: deploy_frontend
        run: |
          echo "::group::前端部署進度"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
          
            # 進入前端專案目錄
            cd /root/dev/FileManager-front
            echo "更新前端代碼"
          
            # 拉取最新代碼確保獲取所有遠端變更
            git fetch --all
          
            # 強制同步到遠端分支
            git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
          
            # 進入主專案目錄
            cd /root/dev/FileManager
          
            echo "停止現有前端服務"
            # 使用 docker compose 停止現有服務
            docker compose down filemanager-front
          
            # 刪除舊的映像檔 (若存在)
            if [ "$(docker images -q filemanager-front:latest)" ]; then
              echo "刪除舊前端映像檔"
              docker rmi filemanager-front:latest
            fi
          
            # 清理無用的映像檔
            docker image prune -f
            docker system prune -af
          
            # 使用 docker compose 重新構建並啟動前端服務
            echo "構建新前端容器"
            docker compose build filemanager-front
          
            echo "啟動前端服務"
            docker compose up -d filemanager-front
          
            # 檢查服務狀態
            echo "檢查前端服務狀態"
            docker ps | grep filemanager-front
          EOF
          echo "::endgroup::"

  check_status:
    needs: [ deploy_backend, deploy_frontend ]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/develop')
    steps:
      - name: 部署結果通知
        run: echo "部署流程完成..."

      - name: 設置 SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 添加主機
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 健康檢查
        id: health_check
        run: |
          echo "::group::健康檢查"
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # 執行應用健康檢查
            echo "執行應用健康檢查"
            HEALTH_CHECK_URL="http://127.0.0.1:8078/actuator/health"
          
            # 嘗試次數
            MAX_ATTEMPTS=5
            ATTEMPT=1
          
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "嘗試 $ATTEMPT/$MAX_ATTEMPTS..."
              RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_CHECK_URL)
          
              if [ "$RESPONSE" = "200" ]; then
                echo "健康檢查通過!"
                exit 0
              else
                echo "健康檢查失敗，狀態碼: $RESPONSE"
                if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                  echo "等待 10 秒後重試..."
                  sleep 10
                fi
              fi
          
              ATTEMPT=$((ATTEMPT+1))
            done
          
            echo "健康檢查失敗: 應用未能在指定時間內就緒"
            exit 1
          EOF
          echo "::endgroup::"

  update_setup_zip_develop:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: [ deploy_backend, deploy_frontend ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 清除 Actions 緩存
        run: |
          echo "清除 Actions 緩存以確保最新代碼"
          rm -rf $GITHUB_WORKSPACE/.git

      - name: 重新檢出代碼
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 確認提交存在
        run: |
          echo "檢查 github.event.before: ${{ github.event.before }}"
          git rev-parse ${{ github.event.before }} || echo "警告：無法找到提交 ${{ github.event.before }}"
          echo "檢查 github.sha: ${{ github.sha }}"
          git rev-parse ${{ github.sha }} || echo "錯誤：無法找到提交 ${{ github.sha }}"
          echo "當前提交:"
          git log -1 --pretty=%H

      - name: 安裝 zip
        run: sudo apt-get install -y zip

      - name: 驗證 docker/src 內容
        run: |
          echo "檢查 docker/src 內容和提交信息"
          git log -1 --pretty=%H
          ls -R docker/src

      - name: 建立新的壓縮檔
        run: |
          echo "建立新的壓縮檔..."
          if [ ! -d "docker/src" ]; then
            echo "錯誤：docker/src 目錄不存在" >&2
            exit 1
          fi
          cd docker/src
          zip -r setup.zip .
          echo "新的壓縮檔已建立 $(pwd)/setup.zip"

      - name: 計算 setup.zip 校驗和
        run: |
          echo "計算 setup.zip 校驗和"
          sha256sum docker/src/setup.zip

      - name: 刪除所有現有 Pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "查詢並刪除所有現有的 Pre-release"
          # 獲取所有 Releases，並保留 prerelease 為 true 的陣列
          RELEASES=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            | jq '[.[] | select(.prerelease == true) | {id: .id, tag_name: .tag_name}]')

          COUNT=$(echo "$RELEASES" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "找到 $COUNT 個 Pre-release，將全部刪除："
            git fetch --tags
            echo "$RELEASES" | jq -c '.[]' | while read -r release; do
              RELEASE_ID=$(echo "$release" | jq -r '.id')
              TAG_NAME=$(echo "$release" | jq -r '.tag_name')
              echo "刪除 Release ID: $RELEASE_ID (標籤: $TAG_NAME)"
              curl -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID
              git push origin :refs/tags/$TAG_NAME
            done
          else
            echo "未找到任何 Pre-release，跳過刪除"
          fi

      - name: 確定 Beta 標籤和 Release 名稱
        id: set_release
        env:
          SHA: ${{ github.sha }}
        run: |
          # 確保 github.sha 存在
          if [ -z "$SHA" ]; then
            echo "錯誤：github.sha 為空"
            exit 1
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c 1-7)
          echo "分支為 develop，設置標籤為 beta-$SHORT_SHA"
          echo "TAG_NAME=beta-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=測試版本 ($SHORT_SHA)" >> $GITHUB_OUTPUT
          echo "RELEASE_BODY=本更新為 develop 分支版本 $SHA 的測試版本" >> $GITHUB_OUTPUT

      - name: 刪除現有 Beta 版本 (latest) Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "查詢並刪除現有的 Beta 版本 (latest) Release"
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/latest | jq -r '.id')
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "找到 Release ID: $RELEASE_ID，開始刪除..."
            curl -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID
            echo "已刪除現有 Beta 版本 (latest) Release"
          else
            echo "未找到現有 Beta 版本 (latest) Release，跳過刪除"
          fi

      - name: 創建 Beta 標籤
        run: |
          TAG_NAME=$(echo "${{ steps.set_release.outputs.TAG_NAME }}")
          echo "創建 Beta 標籤 $TAG_NAME 到提交 ${{ github.sha }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # 刪除舊的標籤（如果存在）
          git tag -d $TAG_NAME || true
          git push origin :refs/tags/$TAG_NAME || true
          # 創建新的標籤
          git tag $TAG_NAME ${{ github.sha }}
          git push origin $TAG_NAME
          echo "Beta 標籤 $TAG_NAME 已創建"

      - name: 驗證標籤提交
        run: |
          TAG_NAME=$(echo "${{ steps.set_release.outputs.TAG_NAME }}")
          echo "驗證標籤 $TAG_NAME 提交"
          git fetch origin +refs/tags/*:refs/tags/*
          TAG_COMMIT=$(git rev-parse $TAG_NAME)
          if [ "$TAG_COMMIT" != "${{ github.sha }}" ]; then
            echo "錯誤：標籤 $TAG_NAME 指向 $TAG_COMMIT，應為 ${{ github.sha }}"
            exit 1
          fi
          echo "標籤 $TAG_NAME 正確指向 ${{ github.sha }}"

      - name: 發佈新 setup.zip 到 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.set_release.outputs.TAG_NAME }}
          name: ${{ steps.set_release.outputs.RELEASE_NAME }}
          body: ${{ steps.set_release.outputs.RELEASE_BODY }}
          files: docker/src/setup.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_setup_zip_release:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release/')
    needs: [ test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 清除 Actions 緩存
        run: |
          echo "清除 Actions 緩存以確保最新代碼"
          rm -rf $GITHUB_WORKSPACE/.git

      - name: 重新檢出代碼
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 確認提交存在
        run: |
          echo "檢查 github.event.before: ${{ github.event.before }}"
          git rev-parse ${{ github.event.before }} || echo "警告：無法找到提交 ${{ github.event.before }}"
          echo "檢查 github.sha: ${{ github.sha }}"
          git rev-parse ${{ github.sha }} || echo "錯誤：無法找到提交 ${{ github.sha }}"
          echo "當前提交:"
          git log -1 --pretty=%H

      - name: 安裝 zip
        run: sudo apt-get install -y zip

      - name: 驗證 docker/src 內容
        run: |
          echo "檢查 docker/src 內容和提交信息"
          git log -1 --pretty=%H
          ls -R docker/src

      - name: 建立新的壓縮檔
        run: |
          echo "建立新的壓縮檔..."
          if [ ! -d "docker/src" ]; then
            echo "錯誤：docker/src 目錄不存在" >&2
            exit 1
          fi
          cd docker/src
          zip -r setup.zip .
          echo "新的壓縮檔已建立 $(pwd)/setup.zip"

      - name: 計算 setup.zip 校驗和
        run: |
          echo "計算 setup.zip 校驗和"
          sha256sum docker/src/setup.zip

      - name: 確定 Release 標籤和名稱
        id: set_release
        env:
          SHA: ${{ github.sha }}
        run: |
          VERSION=$(echo "$GITHUB_REF" | sed 's#refs/heads/release/##')
          echo "分支為 release，設置標籤為 $VERSION"
          echo "TAG_NAME=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=正式版本 $VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_BODY=本更新為 release/$VERSION 分支版本 $SHA 的正式版本" >> $GITHUB_OUTPUT

      - name: 創建版本標籤
        run: |
          TAG_NAME=$(echo "${{ steps.set_release.outputs.TAG_NAME }}")
          echo "創建版本標籤 $TAG_NAME 到提交 ${{ github.sha }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # 刪除舊的標籤（如果存在）
          git tag -d $TAG_NAME || true
          git push origin :refs/tags/$TAG_NAME || true
          # 創建新的標籤
          git tag $TAG_NAME ${{ github.sha }}
          git push origin $TAG_NAME
          echo "版本標籤 $TAG_NAME 已創建"

      - name: 驗證版本標籤提交
        run: |
          TAG_NAME=$(echo "${{ steps.set_release.outputs.TAG_NAME }}")
          echo "驗證標籤 $TAG_NAME 提交"
          git fetch origin +refs/tags/*:refs/tags/*
          TAG_COMMIT=$(git rev-parse $TAG_NAME)
          if [ "$TAG_COMMIT" != "${{ github.sha }}" ]; then
            echo "錯誤：標籤 $TAG_NAME 指向 $TAG_COMMIT，應為 ${{ github.sha }}"
            exit 1
          fi
          echo "標籤 $TAG_NAME 正確指向 ${{ github.sha }}"

      - name: 清理指定 Release 中的所有舊資產
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=$(echo "${{ steps.set_release.outputs.TAG_NAME }}")
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME | jq -r '.id')
          
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            ASSET_IDS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets | jq -r '.[].id')
          
            if [ -n "$ASSET_IDS" ]; then
              echo "找到以下舊資產，將全部刪除："
              echo "$ASSET_IDS"
              for ASSET_ID in $ASSET_IDS; do
                echo "刪除資產 ID: $ASSET_ID"
                curl -X DELETE \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID
              done
            else
              echo "Release $TAG_NAME 中無資產可刪除"
            fi
          else
            echo "未找到 Release $TAG_NAME，將創建新版本"
          fi

      - name: 發佈新 setup.zip 到 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.set_release.outputs.TAG_NAME }}
          name: ${{ steps.set_release.outputs.RELEASE_NAME }}
          body: ${{ steps.set_release.outputs.RELEASE_BODY }}
          files: docker/src/setup.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 刪除現有 latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "查詢並刪除現有的 latest Release"
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/latest | jq -r '.id')
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            echo "找到 Release ID: $RELEASE_ID，開始刪除..."
            curl -X DELETE \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID
            echo "已刪除現有 latest Release"
          else
            echo "未找到現有 latest Release，跳過刪除"
          fi

      - name: 更新 latest 標籤
        run: |
          echo "更新 latest 標籤到提交 ${{ github.sha }}"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # 刪除舊的 latest 標籤（如果存在）
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          # 創建新的 latest 標籤
          git tag latest ${{ github.sha }}
          git push origin latest
          echo "latest 標籤已更新到 ${{ github.sha }}"

      - name: 驗證 latest 標籤提交
        run: |
          echo "驗證 latest 標籤提交"
          git fetch origin +refs/tags/*:refs/tags/*
          TAG_COMMIT=$(git rev-parse latest)
          if [ "$TAG_COMMIT" != "${{ github.sha }}" ]; then
            echo "錯誤：標籤 latest 指向 $TAG_COMMIT，應為 ${{ github.sha }}"
            exit 1
          fi
          echo "標籤 latest 正確指向 ${{ github.sha }}"

      - name: 發佈 latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Release
          body: "本更新為最新的正式版本，基於 ${{ github.sha }}"
          files: docker/src/setup.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}